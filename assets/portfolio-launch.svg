<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Chen Yu OS v2.0.0 — Personal Site</title>
  <desc id="desc">陈煜 · AI Product Manager。从真实场景出发，交付有价值的 AI 产品。个人站已上线，点击终端进入。</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #f8fafb; stroke: #d8e0e7; stroke-width: 2; }
    .bar { fill: #f4f7fa; }
    .divider { stroke: #d8e0e7; stroke-width: 1; }
    .mono { font-family: "Fira Code", "SFMono-Regular", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
    .title { fill: #526273; font-size: 20px; font-weight: 600; }
    .meta { fill: #8b99a8; font-size: 12px; letter-spacing: .8px; }
    /* One shared 12.5s timeline: reveal by 3.5s, hold until 8.5s,
       then fade top-to-bottom with the same stagger and .3s per-line timing.
       The final row is gone at 11.9s; pause .6s before restarting. */
    .line { animation: line1 12.5s ease infinite both; }
    .l2 { animation-name: line2; }
    .l3 { animation-name: line3; }
    .l4 { animation-name: line4; }
    .l5 { animation-name: line5; }
    .l6 { animation-name: line6; }
    .l7 { animation-name: line7; }
    .l8 { animation-name: line8; }
    .l9 { animation-name: line9; }
    .l10 { animation-name: line10; }
    .l11 { animation-name: line11; }
    .l12 { animation-name: line12; }
    .l13 { animation-name: line13; }
    .l14 { animation-name: line14; }
    .log { fill: #82909e; font-size: 18px; }
    .body { fill: #536273; font-size: 19px; }
    .prompt { fill: #2e75e8; font-size: 19px; font-weight: 600; }
    .command { fill: #172230; font-weight: 400; }
    .ok { fill: #33b879; font-weight: 700; }
    .initializing { fill: #2e75e8; font-size: 18px; }
    .ready { fill: #33b879; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .cta { fill: #6f7e8e; font-size: 15px; letter-spacing: 2px; }
    .arrow { fill: none; stroke: #2e75e8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: arrowDrift 1.8s ease-in-out infinite; }
    @keyframes line1 { 0%, .8% { opacity: 0; } 3.2%, 68% { opacity: 1; } 70.4%, 100% { opacity: 0; } }
    @keyframes line2 { 0%, 2.4% { opacity: 0; } 4.8%, 69.6% { opacity: 1; } 72%, 100% { opacity: 0; } }
    @keyframes line3 { 0%, 4% { opacity: 0; } 6.4%, 71.2% { opacity: 1; } 73.6%, 100% { opacity: 0; } }
    @keyframes line4 { 0%, 5.6% { opacity: 0; } 8%, 72.8% { opacity: 1; } 75.2%, 100% { opacity: 0; } }
    @keyframes line5 { 0%, 7.2% { opacity: 0; } 9.6%, 74.4% { opacity: 1; } 76.8%, 100% { opacity: 0; } }
    @keyframes line6 { 0%, 8.8% { opacity: 0; } 11.2%, 76% { opacity: 1; } 78.4%, 100% { opacity: 0; } }
    @keyframes line7 { 0%, 11.2% { opacity: 0; } 13.6%, 78.4% { opacity: 1; } 80.8%, 100% { opacity: 0; } }
    @keyframes line8 { 0%, 12.8% { opacity: 0; } 15.2%, 80% { opacity: 1; } 82.4%, 100% { opacity: 0; } }
    @keyframes line9 { 0%, 15.2% { opacity: 0; } 17.6%, 82.4% { opacity: 1; } 84.8%, 100% { opacity: 0; } }
    @keyframes line10 { 0%, 16.8% { opacity: 0; } 19.2%, 84% { opacity: 1; } 86.4%, 100% { opacity: 0; } }
    @keyframes line11 { 0%, 19.2% { opacity: 0; } 21.6%, 86.4% { opacity: 1; } 88.8%, 100% { opacity: 0; } }
    @keyframes line12 { 0%, 21.6% { opacity: 0; } 24%, 88.8% { opacity: 1; } 91.2%, 100% { opacity: 0; } }
    @keyframes line13 { 0%, 24% { opacity: 0; } 26.4%, 91.2% { opacity: 1; } 93.6%, 100% { opacity: 0; } }
    @keyframes line14 { 0%, 25.6% { opacity: 0; } 28%, 92.8% { opacity: 1; } 95.2%, 100% { opacity: 0; } }
    @keyframes arrowDrift {
      0%, 100% { opacity: .3; transform: translateX(-4px); }
      50% { opacity: 1; transform: translateX(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .line, .arrow { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect class="window" x="1" y="1" width="998" height="618" rx="18"/>
